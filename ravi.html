<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Video Player</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }
    .player-container {
      width: 90%;
      max-width: 900px;
      background: #1c1c1c;
      padding: 15px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
    }
    h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      word-break: break-all;
    }
    /* वीडियो और ओवरले कंटेनर */
    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      touch-action: pan-x;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
      outline: none;
      transition: filter 0.1s ease;
    }
    /* 2X स्पीड बैज (होल्ड करने पर) */
    .speed-badge {
      display: none;
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #ffd700;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid #ffd700;
      z-index: 10;
      pointer-events: none;
    }
    /* स्क्रीन पर कॉर्नर स्पीड और टाइम बैज (Image 1 की तरह) */
    .corner-speed-pill {
      position: absolute;
      bottom: 58px;
      left: 15px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      color: #fff;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      z-index: 8;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: background 0.2s;
    }
    .corner-speed-pill:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    /* डबल-टैप रिपल/एनिमेशन बैज */
    .tap-indicator {
      display: none;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      z-index: 10;
      pointer-events: none;
    }
    .tap-indicator.left {
      left: 15%;
    }
    .tap-indicator.right {
      right: 15%;
    }

    /* ब्राइटनेस और वॉल्यूम HUD इंडिकेटर */
    .hud-indicator {
      display: none;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      z-index: 15;
      pointer-events: none;
      text-align: center;
      min-width: 90px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .hud-indicator.left {
      left: 20px;
    }
    .hud-indicator.right {
      right: 20px;
    }
    .hud-bar {
      width: 100%;
      height: 5px;
      background: #444;
      border-radius: 4px;
      margin-top: 6px;
      overflow: hidden;
    }
    .hud-fill {
      height: 100%;
      background: #00e5ff;
      width: 100%;
    }
    #volumeFill {
      background: #ff9800;
    }

    /* नीचे के बटन */
    .controls-btn-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }
    .seek-btn {
      background-color: #2b2b2b;
      color: #ffffff;
      border: 1px solid #444;
      padding: 9px 16px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s;
    }
    .seek-btn:hover {
      background-color: #3d3d3d;
      border-color: #666;
    }
    .seek-btn:active {
      transform: scale(0.97);
    }

    /* चैनल नाम स्टाइल */
    .channel-branding {
      margin-top: 16px;
      text-align: center;
      padding-top: 10px;
      border-top: 1px solid #2a2a2a;
    }
    .channel-title {
      font-size: 1.15rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff416c, #ff4b2b, #ffb300);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      text-decoration: none;
      cursor: pointer;
    }
    .channel-sub {
      font-size: 0.8rem;
      color: #888;
      margin-top: 3px;
      letter-spacing: 1px;
    }

    /* =========================================
       स्पीड कंट्रोल शीट / मोडल (Image 2 की तरह)
       ========================================= */
    .speed-sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .speed-sheet {
      background: #ffffff;
      color: #111111;
      width: 100%;
      max-width: 480px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 12px 20px 28px 20px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.4);
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      background: #ddd;
      border-radius: 4px;
      margin: 4px auto 16px auto;
    }
    .sheet-header-value {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #111;
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
    }
    .step-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #f1f3f4;
      color: #111;
      font-size: 22px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .step-btn:active {
      background: #e2e4e7;
    }
    .slider-container {
      flex: 1;
      display: flex;
      align-items: center;
    }
    .slider-container input[type="range"] {
      width: 100%;
      accent-color: #000;
      height: 4px;
      cursor: pointer;
    }
    /* पिल्स ग्रिड */
    .speed-pills-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .speed-pill-btn {
      background: #f1f3f4;
      border: 1px solid transparent;
      border-radius: 24px;
      padding: 10px 4px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #222;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .speed-pill-btn span.subtext {
      font-size: 9px;
      font-weight: normal;
      color: #666;
      margin-top: 2px;
    }
    .speed-pill-btn.active {
      background: #000;
      color: #fff;
    }
    .speed-pill-btn.active span.subtext {
      color: #ccc;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <h2 id="movieTitle">Loading Stream...</h2>
    
    <div class="video-wrapper" id="videoBox">
      <!-- 2X स्पीड इंडिकेटर (होल्ड पर) -->
      <div class="speed-badge" id="speedBadge">⏩ 2X Speed</div>

      <!-- डबल टैप इंडिकेटर -->
      <div class="tap-indicator left" id="leftBadge">⏪ 10s</div>
      <div class="tap-indicator right" id="rightBadge">10s ⏩</div>

      <!-- ब्राइटनेस और वॉल्यूम जेस्चर HUD -->
      <div class="hud-indicator left" id="brightnessHud">
        <span id="brightnessText">☀️ 100%</span>
        <div class="hud-bar"><div class="hud-fill" id="brightnessFill"></div></div>
      </div>

      <div class="hud-indicator right" id="volumeHud">
        <span id="volumeText">🔊 100%</span>
        <div class="hud-bar"><div class="hud-fill" id="volumeFill"></div></div>
      </div>

      <!-- टाइम व स्पीड बैज (Image 1 की तरह) -->
      <div class="corner-speed-pill" id="cornerSpeedPill" onclick="openSpeedSheet()">
        <span id="currentTimeText">0:00</span> • <span id="cornerSpeedVal">1.0x</span>
      </div>

      <video id="myVideo" controls preload="metadata" playsinline>
        <source id="videoSource" src="https://pub-e251743f81f04885a4aaf157ca014f09.r2.dev/e4b9af58479a205e0c21394d9cdad8c6" type="video/mp4">
        आपका ब्राउज़र इस वीडियो फ़ाइल को सीधे चलाने का समर्थन नहीं करता है।
      </video>
    </div>

    <!-- बटन कंट्रोल्स -->
    <div class="controls-btn-container">
      <button class="seek-btn" onclick="seekVideo(-10)">⏪ 10s पीछे</button>
      <button class="seek-btn" onclick="seekVideo(10)">10s आगे ⏩</button>
      <button class="seek-btn" onclick="openSpeedSheet()">⚡ गति (<span id="btnSpeedVal">1.0x</span>)</button>
      <button class="seek-btn" id="pipBtn" onclick="togglePiP()">📺 PiP</button>
    </div>

    <!-- चैनल नाम और टेलीग्राम लिंक -->
    <div class="channel-branding">
      <a href="https://t.me/tg_kkg" target="_blank" rel="noopener noreferrer" class="channel-title">🎬 RAVI KOHLI</a>
      <div class="channel-sub">Official Channel</div>
    </div>
  </div>

  <!-- स्पीड कंट्रोल बॉटम शीट (Image 2 की तरह) -->
  <div class="speed-sheet-overlay" id="speedSheetOverlay" onclick="closeSpeedSheet(event)">
    <div class="speed-sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-header-value" id="sheetSpeedDisplay">1.00x</div>
      
      <!-- स्लाइडर व स्टेपर्स -->
      <div class="slider-row">
        <button class="step-btn" onclick="adjustSpeed(-0.05)">−</button>
        <div class="slider-container">
          <input type="range" id="speedSlider" min="0.25" max="2.5" step="0.05" value="1.0" oninput="onSliderChange(this.value)">
        </div>
        <button class="step-btn" onclick="adjustSpeed(0.05)">+</button>
      </div>

      <!-- पिल्स ग्रिड (Image 2 के विकल्प) -->
      <div class="speed-pills-grid">
        <div class="speed-pill-btn" onclick="setCustomSpeed(0.25)">0.25</div>
        <div class="speed-pill-btn" onclick="setCustomSpeed(0.5)">0.5</div>
        <div class="speed-pill-btn" onclick="setCustomSpeed(0.75)">0.75</div>
        <div class="speed-pill-btn active" id="normalPill" onclick="setCustomSpeed(1.0)">
          1.0
          <span class="subtext">Normal</span>
        </div>
        <div class="speed-pill-btn" onclick="setCustomSpeed(1.25)">1.25</div>
        
        <div class="speed-pill-btn" onclick="setCustomSpeed(1.5)">1.5</div>
        <div class="speed-pill-btn" onclick="setCustomSpeed(1.75)">1.75</div>
        <div class="speed-pill-btn" onclick="setCustomSpeed(2.0)">2.0</div>
        <div class="speed-pill-btn" onclick="setCustomSpeed(2.25)">2.25</div>
        <div class="speed-pill-btn" onclick="setCustomSpeed(2.5)">2.5</div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('myVideo');
    const videoSource = document.getElementById('videoSource');
    const movieTitle = document.getElementById('movieTitle');
    const videoBox = document.getElementById('videoBox');
    const speedBadge = document.getElementById('speedBadge');
    const leftBadge = document.getElementById('leftBadge');
    const rightBadge = document.getElementById('rightBadge');

    // स्पीड एलिमेंट्स
    const speedSheetOverlay = document.getElementById('speedSheetOverlay');
    const sheetSpeedDisplay = document.getElementById('sheetSpeedDisplay');
    const speedSlider = document.getElementById('speedSlider');
    const cornerSpeedVal = document.getElementById('cornerSpeedVal');
    const currentTimeText = document.getElementById('currentTimeText');
    const btnSpeedVal = document.getElementById('btnSpeedVal');

    // ब्राइटनेस / वॉल्यूम एलिमेंट्स
    const brightnessHud = document.getElementById('brightnessHud');
    const brightnessText = document.getElementById('brightnessText');
    const brightnessFill = document.getElementById('brightnessFill');
    const volumeHud = document.getElementById('volumeHud');
    const volumeText = document.getElementById('volumeText');
    const volumeFill = document.getElementById('volumeFill');
    const pipBtn = document.getElementById('pipBtn');

    // स्टेट वेरिएबल्स
    let brightness = 1.0;
    let volume = 1.0;
    let currentSpeed = 1.0;
    let hudTimeout = null;

    // टाइम फॉर्मेटिंग (mm:ss)
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // टाइम अपडेट लिसनर (Image 1 की तरह टाइम दिखाने हेतु)
    video.addEventListener('timeupdate', () => {
      currentTimeText.textContent = formatTime(video.currentTime);
    });

    // ==========================================
    // स्पीड कंट्रोल लॉजिक (Image 2)
    // ==========================================
    function openSpeedSheet() {
      speedSheetOverlay.style.display = 'flex';
      updateSpeedUI(currentSpeed);
    }

    function closeSpeedSheet(e) {
      speedSheetOverlay.style.display = 'none';
    }

    function setCustomSpeed(val) {
      val = Math.max(0.25, Math.min(2.5, parseFloat(val)));
      currentSpeed = parseFloat(val.toFixed(2));
      video.playbackRate = currentSpeed;
      updateSpeedUI(currentSpeed);
    }

    function onSliderChange(val) {
      setCustomSpeed(val);
    }

    function adjustSpeed(delta) {
      let next = currentSpeed + delta;
      next = Math.round(next * 100) / 100;
      setCustomSpeed(next);
    }

    function updateSpeedUI(val) {
      const fixedStr = val.toFixed(2) + 'x';
      const simpleStr = (val % 1 === 0 ? val.toFixed(1) : val) + 'x';

      sheetSpeedDisplay.textContent = fixedStr;
      speedSlider.value = val;
      cornerSpeedVal.textContent = simpleStr;
      btnSpeedVal.textContent = simpleStr;

      // पिल बटनों की एक्टिव स्टेट हाइलाइट करना
      const pills = document.querySelectorAll('.speed-pill-btn');
      pills.forEach(pill => {
        const textVal = parseFloat(pill.childNodes[0].textContent.trim());
        if (Math.abs(textVal - val) < 0.01) {
          pill.classList.add('active');
        } else {
          pill.classList.remove('active');
        }
      });
    }

    // ==========================================
    // टाइटल और PiP लॉजिक
    // ==========================================
    function autoSetMovieTitle() {
      try {
        const rawUrl = videoSource.getAttribute('src') || video.currentSrc;
        if (!rawUrl) return;

        const urlObj = new URL(rawUrl, window.location.href);
        let filename = urlObj.searchParams.get('response-content-disposition');

        if (!filename) {
          const pathname = urlObj.pathname;
          filename = pathname.substring(pathname.lastIndexOf('/') + 1);
        }

        if (filename) {
          filename = decodeURIComponent(filename);
          let cleanName = filename.replace(/\.(mp4|mkv|avi|webm|mov|flv)$/i, '');
          cleanName = cleanName.replace(/[._]/g, ' ').trim();
          movieTitle.textContent = cleanName + " (Online Stream)";
          document.title = cleanName + " - Online Video Player";
        }
      } catch (e) {
        console.error("टाइटल लोड करने में समस्या:", e);
      }
    }
    autoSetMovieTitle();

    async function togglePiP() {
      try {
        if (!document.pictureInPictureEnabled) {
          alert("आपके ब्राउज़र में Picture-in-Picture सपोर्ट नहीं है।");
          return;
        }
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        console.error("PiP त्रुटि:", err);
      }
    }

    if (!document.pictureInPictureEnabled) {
      pipBtn.style.display = 'none';
    }

    function seekVideo(seconds) {
      if (video) {
        video.currentTime = Math.max(0, Math.min(video.currentTime + seconds, video.duration || Infinity));
      }
    }

    let badgeTimeout = null;
    function showBadge(badge) {
      clearTimeout(badgeTimeout);
      leftBadge.style.display = 'none';
      rightBadge.style.display = 'none';
      badge.style.display = 'block';
      badgeTimeout = setTimeout(() => {
        badge.style.display = 'none';
      }, 600);
    }

    function setBrightness(val) {
      brightness = Math.max(0.2, Math.min(val, 2.0));
      video.style.filter = `brightness(${brightness})`;
      const pct = Math.round((brightness / 2.0) * 100);
      brightnessText.textContent = `☀️ ${pct}%`;
      brightnessFill.style.width = `${pct}%`;

      brightnessHud.style.display = 'block';
      clearTimeout(hudTimeout);
      hudTimeout = setTimeout(() => {
        brightnessHud.style.display = 'none';
      }, 1000);
    }

    function setVolume(val) {
      volume = Math.max(0, Math.min(val, 1));
      video.volume = volume;
      const pct = Math.round(volume * 100);
      volumeText.textContent = pct === 0 ? '🔇 Mute' : `🔊 ${pct}%`;
      volumeFill.style.width = `${pct}%`;

      volumeHud.style.display = 'block';
      clearTimeout(hudTimeout);
      hudTimeout = setTimeout(() => {
        volumeHud.style.display = 'none';
      }, 1000);
    }

    // 2X स्पीड (लॉन्ग प्रेस पर)
    let pressTimer = null;
    let isHoldingFast = false;
    let lastTapTime = 0;

    function startFast() {
      if (video && !video.paused) {
        isHoldingFast = true;
        video.playbackRate = 2.0;
        speedBadge.style.display = 'block';
      }
    }

    function endFast() {
      clearTimeout(pressTimer);
      if (isHoldingFast) {
        video.playbackRate = currentSpeed; // यूजर द्वारा सेट की गई स्पीड पर रीसेट
        speedBadge.style.display = 'none';
        isHoldingFast = false;
      }
    }

    // डबल टैप (सीक 10s)
    function handleTap(clientX) {
      const rect = videoBox.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const isRightSide = clickX > rect.width / 2;

      const now = Date.now();
      if (now - lastTapTime < 320) {
        clearTimeout(pressTimer);
        if (isRightSide) {
          seekVideo(10);
          showBadge(rightBadge);
        } else {
          seekVideo(-10);
          showBadge(leftBadge);
        }
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
    }

    // स्वाइप जेस्चर (ब्राइटनेस और वॉल्यूम)
    let touchStartY = 0;
    let touchStartX = 0;
    let isDraggingGesture = false;
    let activeSide = null;

    videoBox.addEventListener('touchstart', (e) => {
      // कॉर्नर पिल पर क्लिक होने पर जेस्चर न चलाएं
      if (e.target.closest('#cornerSpeedPill')) return;

      const touch = e.touches[0];
      const rect = videoBox.getBoundingClientRect();
      touchStartY = touch.clientY;
      touchStartX = touch.clientX;
      isDraggingGesture = false;

      activeSide = (touch.clientX - rect.left) < (rect.width / 2) ? 'left' : 'right';

      handleTap(touch.clientX);
      pressTimer = setTimeout(startFast, 400);
    }, { passive: true });

    videoBox.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const deltaY = touchStartY - touch.clientY;
      const deltaX = Math.abs(touch.clientX - touchStartX);

      if (Math.abs(deltaY) > 10 && Math.abs(deltaY) > deltaX) {
        isDraggingGesture = true;
        clearTimeout(pressTimer);

        const sensitivity = 0.005;

        if (activeSide === 'left') {
          setBrightness(brightness + (deltaY * sensitivity));
        } else {
          setVolume(volume + (deltaY * sensitivity));
        }
        touchStartY = touch.clientY;
      }
    }, { passive: true });

    videoBox.addEventListener('touchend', () => {
      endFast();
      isDraggingGesture = false;
    });

    videoBox.addEventListener('touchcancel', () => {
      endFast();
      isDraggingGesture = false;
    });

    // डेस्कटॉप माउस सपोर्ट
    videoBox.addEventListener('mousedown', (e) => {
      if (e.target.closest('#cornerSpeedPill')) return;
      handleTap(e.clientX);
      pressTimer = setTimeout(startFast, 400);
    });
    videoBox.addEventListener('mouseup', endFast);
    videoBox.addEventListener('mouseleave', endFast);
  </script>

</body>
</html>
